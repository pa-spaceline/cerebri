CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_CODE_DATA_RELOCATION=y

# Console/shell over USB CDC-ACM (see the board dts's cdc_acm_uart0 node) -
# no debug UART adapter needed, same USB cable used to flash. Matches
# Zephyr's own samples/subsys/shell/shell_module/overlay-usb.conf.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Tropic Community VMU"
CONFIG_UART_LINE_CTRL=y

# The USB stack's own INF-level logging (one line per control transfer
# during enumeration) was flooding the small default log ring buffer at
# boot, evicting other modules' still-unprocessed messages (confirmed via
# "--- N messages dropped ---" markers in captured boot logs, right when
# trying to diagnose why the GNSS driver printed nothing at all despite
# clearly being compiled in and enabled). Quiet it down and grow the
# buffer so real diagnostic messages don't get silently lost in the noise.
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_LOG_BUFFER_SIZE=4096

# Zephyr's own default TX ring buffer for the interrupt-driven shell serial
# backend is a tiny 8 bytes (subsys/shell/backends/Kconfig.backends) - its
# own help text says increasing it "reduces number of interrupts". This
# shell redraws its prompt after nearly every single log line (heavy VT100
# escape sequences), so with only 8 bytes of buffering that turns into a
# storm of tiny interrupt-driven UART bursts under any burst of console
# output (e.g. IMU calibration's several result lines printing back to
# back) - real terminal emulators (confirmed with `screen`) can drop bytes
# under that kind of jittery, chopped-up transmission pattern, making
# output look like it stalled/never printed when it actually did. Bumped
# generously so the whole burst goes out as one clean transfer instead of
# dozens of small ones.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=512

CONFIG_TEST=y
CONFIG_UBSAN=n
CONFIG_ASSERT_LEVEL=2
CONFIG_ASSERT_VERBOSE=y

CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_STACK_CANARIES=y
CONFIG_ISR_STACK_SIZE=8192

# NOTE: a "boot log to SD card via zephyr,fstab automount +
# CONFIG_LOG_BACKEND_FS" diagnostic was tried and removed - it caused
# unrelated, genuine intermittent boot instability of its own (confirmed
# by bisection: added latency/resource use during boot made an already-
# marginal IMU driver init timeout fail more often, and this build's own
# startup tone became inconsistent). Don't re-add without first
# retesting IMU/buzzer reliability across several power cycles.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_IMMEDIATE=n

CONFIG_FPU=y

# gains (copied from mr_vmu_tropic as a starting point - retune for this
# airframe/motor combination before flight)
CONFIG_CEREBRI_RDD2_THRUST_TRIM=10976
CONFIG_CEREBRI_RDD2_THRUST_DELTA=10976

CONFIG_CEREBRI_RDD2_ROLL_KP=5000000
CONFIG_CEREBRI_RDD2_PITCH_KP=5000000
CONFIG_CEREBRI_RDD2_YAW_KP=2000000

CONFIG_CEREBRI_RDD2_ROLLRATE_KP=600000
CONFIG_CEREBRI_RDD2_PITCHRATE_KP=600000
CONFIG_CEREBRI_RDD2_YAWRATE_KP=100000

CONFIG_CEREBRI_RDD2_ROLLRATE_KI=50000
CONFIG_CEREBRI_RDD2_PITCHRATE_KI=50000
CONFIG_CEREBRI_RDD2_YAWRATE_KI=50000

CONFIG_CEREBRI_RDD2_ROLLRATE_IMAX=20000
CONFIG_CEREBRI_RDD2_PITCHRATE_IMAX=20000
CONFIG_CEREBRI_RDD2_YAWRATE_IMAX=20000

CONFIG_CEREBRI_RDD2_ROLLRATE_KD=20000
CONFIG_CEREBRI_RDD2_PITCHRATE_KD=20000
CONFIG_CEREBRI_RDD2_YAWRATE_KD=0
CONFIG_CEREBRI_RDD2_ATTITUDE_RATE_FCUT=10000

# Previous values (copied from mr_vmu_tropic, untuned):
# CONFIG_CEREBRI_RDD2_ATTITUDE_EST_ACCEL_GAIN=140
# CONFIG_CEREBRI_RDD2_ATTITUDE_EST_MAG_GAIN=800
# PX4 attitude_estimator_q defaults (ATT_W_ACC=0.2, ATT_W_MAG=0.1), units of 1e-3:
CONFIG_CEREBRI_RDD2_ATTITUDE_EST_ACCEL_GAIN=200
CONFIG_CEREBRI_RDD2_ATTITUDE_EST_MAG_GAIN=100

# RDD2 APPS
CONFIG_CEREBRI_RDD2_ALLOCATION=y
CONFIG_CEREBRI_RDD2_ANGULAR_VELOCITY=y
CONFIG_CEREBRI_RDD2_ATTITUDE=y
CONFIG_CEREBRI_RDD2_COMMAND=y
CONFIG_CEREBRI_RDD2_ESTIMATE=y
CONFIG_CEREBRI_RDD2_ESTIMATE_ODOMETRY_ETHERNET=n
CONFIG_CEREBRI_RDD2_FSM=y
CONFIG_CEREBRI_RDD2_LIGHTING=n
CONFIG_CEREBRI_RDD2_POSITION=y

CONFIG_CEREBRI_ACTUATE_PWM_SHELL=n
CONFIG_CEREBRI_ACTUATE_SOUND=y

# This was mistakenly believed to hang boot on its own, same as Ethernet
# (see CONFIG_ZROS_SENSE_BARO's comment above) - actually the barometer
# driver's bug the whole time. Confirmed clean with a physical UART
# console once that was fixed: logs "Arming monitor started - logging
# will start when armed" and boots normally.
CONFIG_CEREBRI_SYNAPSE_LOG_SDCARD=y

# Two identical ICM-42670-P IMUs (imu0/imu1 in the board dts). zros_drivers'
# sense_imu only ever reads DT_ALIAS(accel0)/DT_ALIAS(gyro0) - ACCEL/GYRO_
# COUNT is not consulted by that driver - so only imu0 is wired into the
# pipeline. imu1 is still enabled in the board's devicetree and reachable
# via the sensor shell for bring-up/verification/redundancy work later.
CONFIG_ZROS_SENSE_STREAM=n
CONFIG_ZROS_SENSE_IMU=y
CONFIG_ZROS_SENSE_IMU_ACCEL_COUNT=1
CONFIG_ZROS_SENSE_IMU_GYRO_COUNT=1

CONFIG_ZROS_SENSE_MAG=y
CONFIG_ZROS_SENSE_MAG_COUNT=1

# FIXED: this used to hang boot. Root cause, found via a physical UART
# console + a decoded bus-fault register dump: two real bugs in
# modules/lib/zros_drivers/drivers/sense/baro/main.c, both fixed there
# directly (not board/app-specific):
#   1. baro_timer_handler() submitted a stray, separately-defined
#      `K_WORK_DEFINE(baro_work, ...)` work item instead of the
#      `g_ctx.work_item` actually embedded in context_t. baro_work_handler's
#      CONTAINER_OF() then computed a bogus "ctx" pointer (effectively
#      the address of the stray work item itself), so every ctx->
#      field access read unrelated nearby memory - deterministically,
#      hence the identical crash signature every single boot regardless
#      of what else was enabled.
#   2. sense_baro_entry_point() never called zros_node_init()/
#      zros_pub_init() for ctx->node/ctx->pub, so ctx->pub was used
#      completely uninitialized in zros_pub_update() - masked until
#      bug #1 was fixed, then surfaced as a second bus fault inside
#      Zephyr's own k_mutex_lock() (dereferencing a topic mutex that
#      was never actually part of the intended object).
CONFIG_ZROS_SENSE_BARO=y
CONFIG_ZROS_SENSE_BARO_COUNT=1

# The ARM safety switch (/gpio_keys, checked against
# drivers/sense/safety/main.c) is wired in the board dts the same way
# mr_vmu_tropic does it - see the board dts's header comment.
CONFIG_CEREBRI_SENSE_SAFETY=y

# RC input, CRSF (see the board dts's lpuart8/rc0 node - swap these for
# CONFIG_INPUT_SBUS_* if the receiver actually plugged in here is SBUS).
CONFIG_CEREBRI_SENSE_RC=y
CONFIG_INPUT_CRSF_THREAD_STACK_SIZE=8192
CONFIG_INPUT_CRSF_REPORT_FILTER=0

# GPS on lpuart2, generic NMEA-0183 driver (works with any standard
# module, not just one vendor's chip - see the overlay's gnss1 node).
CONFIG_ZROS_SENSE_GNSS=y

# Ethernet is this codebase's actual telemetry/synapse transport - the
# board has a real PHY (DP83825, confirmed against the schematic's
# RJ45+magnetics connector). This was mistakenly believed to hang boot
# on its own; a physical UART console (see CONFIG_ZROS_SENSE_BARO's
# comment above) proved that was actually the barometer driver's bug
# the whole time - with that fixed, Ethernet enabled alongside
# everything else boots and runs cleanly with no fault.
CONFIG_CEREBRI_SYNAPSE_ETH_RX=y
CONFIG_CEREBRI_SYNAPSE_ETH_TX=y
CONFIG_CEREBRI_ACTUATE_LED_ARRAY=n

# drivers/sense/power/main.c wants one devicetree sensor device (alias
# power0) reporting both SENSOR_CHAN_VOLTAGE and SENSOR_CHAN_CURRENT - see
# the board dts's header comment for why the ADC_A/ADC_V pins alone can't
# satisfy that without custom driver work.
CONFIG_CEREBRI_SENSE_POWER=n

CONFIG_PWM=y

CONFIG_CAN=y
CONFIG_CAN_MAX_FILTER=5
CONFIG_CAN_SHELL=y

CONFIG_NET_DRIVERS=y
CONFIG_NET_CANBUS=y

CONFIG_NET_SOCKETS_CAN=y
CONFIG_NET_DEFAULT_IF_CANBUS_RAW=y

CONFIG_CAN_LOG_LEVEL_DBG=n
CONFIG_CAN_FD_MODE=y
CONFIG_SHELL_ARGC_MAX=72
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_DEBUG_THREAD_INFO=y
